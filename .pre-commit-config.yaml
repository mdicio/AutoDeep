repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --select, "E,F,W,I,B", --ignore, "E501,B008,B904,B905"]
        files: ^(autodeep|tests|examples)/.*\.py$
        exclude: ^autodeep/modelutils/igtdutilities\.py$

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: [--line-length=150]
        files: ^(autodeep|tests|examples)/.*\.py$
        exclude: ^autodeep/modelutils/igtdutilities\.py$
